<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tableau de bord - Hôpital de Bambey</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fa;
        }

        header {
            background: #087fb7;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 17px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .welcome h2 {
            margin-top: 0;
            color: #087fb7;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat h3 {
            margin: 0;
            font-size: 18px;
        }

        .number {
            font-size: 35px;
            font-weight: bold;
            color: #087fb7;
            margin-top: 10px;
        }

        .menu {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .menu button {
            padding: 20px 10px;
            border: none;
            border-radius: 10px;
            background: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .menu button:hover {
            background: #087fb7;
            color: white;
        }

        .retour {
    background: #555;
      width: 100%;  
       padding:20px;
         margin-top:15px;
           border-radius:10px; 
         gap:20px;
          
}
            
        @media (max-width: 600px) {

            .stats,
            .menu {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 24px;
            }
            

        }

    </style>
</head>

<body>

<header>

    <h1>🏥 HOPITAL DE BAMBEY</h1>

    <p>
        Tableau de bord administratif
    </p>

</header>


<div class="container">


    <div class="welcome">

        <h2>Bienvenue dans votre espace</h2>

        <p>
            Gérez les patients, les tickets,
            les rendez-vous et les services de l'hôpital.
        </p>

    </div>


    <div class="stats">


        <div class="stat">

            <h3>👥 Patients</h3>

            <div class="number">
                125
            </div>

        </div>


        <div class="stat">

            <h3>🎫 Tickets aujourd'hui</h3>

            <div class="number">
                200
            </div>

        </div>


        <div class="stat">

            <h3>📅 Rendez-vous</h3>

            <div class="number">
                23
            </div>

        </div>


        <div class="stat">

            <h3>🛏️ Lits disponibles</h3>

            <div class="number">
                12
            </div>

        </div>


    </div>


    <div class="menu">

        <button onclick="patients()">
            👥 Patients
        </button>

        <button onclick="tickets()">
            🎫 Tickets
        </button>

        <button onclick="rendezvous()">
            📅 Rendez-vous
        </button>

        <button onclick="services()">
            🏥 Services
        </button>

        <button onclick="hospitalisation()">
            🛏️ Hospitalisation
        </button>

        <button onclick="statistiques()">
            📊 Statistiques
        </button>

    </div>
    


<script>

function patients() {
    alert("Module Patients");
}

function tickets() {
    alert("Module Tickets");
}

function rendezvous() {
    alert("Module Rendez-vous");
}

function services() {
    alert("Module Services");
}

function hospitalisation() {
    alert("Module Hospitalisation");
}

function statistiques() {
    alert("Module Statistiques");
}

function deconnexion() {

    if (confirm("Voulez-vous vous déconnecter ?")) {

        window.location.href = "index.html";

    }

}
    

</script>

<button
class="retour"
    < onclick="window.location.href='hopital.html'">

⬅️ Retour à l'accueil

</button>
</body>
</html>
