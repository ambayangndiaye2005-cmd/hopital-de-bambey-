<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket - Hôpital de Bambey</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            text-align: center;
            margin: 0;
        }

        header {
            background: #087f5b;
            color: white;
            padding: 25px;
        }

        .ticket {
            background: white;
            width: 90%;
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        input, select, button {
            width: 90%;
            padding: 13px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #087f5b;
            color: white;
            border: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🎫 Ticket</h1>
    <p>Hôpital de Bambey</p>
</header>

<div class="ticket">

    <h2>Prendre un ticket</h2>

    <input type="text" placeholder="Nom du patient">

    <input type="text" placeholder="Prénom du patient">

    <select>
        <option>Choisir le service</option>
        <option>Consultation</option>
        <option>Maternité</option>
        <option>Pédiatrie</option>
        <option>Urgences</option>
        <option>Laboratoire</option>
    </select>

    <button onclick="prendreTicket()">
        Prendre le ticket
    </button>

    <h2 id="resultat"></h2>

</div>

<script>
function prendreTicket() {
    let numero = Math.floor(Math.random() * 100) + 1;

    document.getElementById("resultat").innerHTML =
        "Votre numéro de ticket : " + numero;
}
</script>

</body>
</html>
